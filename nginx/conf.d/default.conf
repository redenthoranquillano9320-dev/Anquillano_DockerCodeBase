# =========================================================
# SERVER 1 - Main System (Library CRUD Application) - Port 80
# =========================================================
server {
    listen 80;
    server_name localhost;

    root /var/www/main_system;
    index index.html index.php;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}

# =========================================================
# SERVER 2 - Microservice System (Author API) - Port 81
# =========================================================
server {
    listen 81;
    server_name localhost;

    root /var/www/microservice;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-microservice:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Allow CORS so the Main System (port 80) can fetch this API
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

    location ~ /\.ht {
        deny all;
    }
}
